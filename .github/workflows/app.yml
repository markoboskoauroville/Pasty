name: Build app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  app:
    name: Build and publish Pasty.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: VERSION=1.0.0 BUILD=${{ github.run_number }} ./scripts/build_app.sh

      - name: Zip the bundle
        run: |
          cd packaging
          ditto -c -k --sequesterRsrc --keepParent Pasty.app "../Pasty-build-${{ github.run_number }}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "build-${{ github.run_number }}" \
            "Pasty-build-${{ github.run_number }}.zip" \
            --title "Pasty build ${{ github.run_number }}" \
            --notes "Unsigned local build. Unzip, move to /Applications, then run: xattr -dr com.apple.quarantine /Applications/Pasty.app"

      - name: Keep only the two newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName --jq '.[2:][].tagName' > old.txt || true
          while read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --yes --cleanup-tag
            echo "deleted $tag"
          done < old.txt
